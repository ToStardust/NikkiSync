name: NikkiSync CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: nikkisync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run mobile:validate
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - run: bun test apps/pc-companion/test/local-sync-server.test.ts --test-name-pattern 'production TLS'
      - run: bun test tools/windows-performance/sqlite-cache.test.mjs

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
